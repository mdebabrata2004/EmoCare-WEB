<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="emocareGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Squircle -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#emocareGrad)" filter="url(#glow)"/>
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#emocareGrad)"/>
  <rect x="4" y="4" width="56" height="56" rx="16" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>

  <!-- Face Eyes -->
  <circle cx="23" cy="27" r="3.5" fill="#ffffff"/>
  <circle cx="41" cy="27" r="3.5" fill="#ffffff"/>

  <!-- Cheeks -->
  <circle cx="17" cy="35" r="1.5" fill="rgba(255,255,255,0.7)"/>
  <circle cx="47" cy="35" r="1.5" fill="rgba(255,255,255,0.7)"/>

  <!-- Smile Arc -->
  <path d="M22 36 Q32 46 42 36" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
</svg>
