<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>EmoCare </title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="card">
    <h1>EMO-CARE</h1>
    <p class="subtitle">Real-time face and expression detection</p>

    <div class="video-wrap">
      <video id="video" autoplay muted playsinline></video>
      <canvas id="overlay"></canvas>
    </div>

    

    <div class="controls">
      <button id="startBtn">Start Camera</button>
      <button id="stopBtn" disabled>Stop</button>
      <label><input type="checkbox" id="soundToggle" checked /> Play sound on face detected</label>
    </div>

    <div id="info" class="info">Status: Idle</div>

    <footer>
      <small>© Copyright 2024, Debabrata Mondal</small>
    </footer>
  </main>

  <!-- face-api.js from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.22.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
